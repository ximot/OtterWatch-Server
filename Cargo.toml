[package]
name = "otterwatch-server"
version = "0.3.6"
authors = ["Tomasz Wyderka <twyderka@me.com>"]
description = "Central metrics collection server for OtterWatch agents"
repository = "https://github.com/ximot/otterwatch-server"
readme = "README.md"
edition = "2021"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1.39", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# MQTT client
rumqttc = "0.24"

# Database (PostgreSQL with TimescaleDB)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Protocol Buffers
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = { version = "0.15", default-features = false, features = ["toml"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"

# Crypto for API key hashing
sha2 = "0.10"
hex = "0.4"

# HTTP client for MQTT cluster proxy
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
prost-build = "0.13"
